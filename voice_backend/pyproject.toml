[project]
name = "hypercheap-voice-agent-backend"
version = "0.1.1"
description = "Python Backend for the Hypercheap Voice Agent"
authors = [{ name = "Jordan Gibbs", email = "jordan@jordangibbs.xyz" }]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "httpx[http2]>=0.27",
    "openai>=1.40",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "black>=24.4",
    "ruff>=0.4",
    "mypy>=1.9",
]

[tool.black]
line-length = 120

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
# The codebase uses typing.Optional / Dict / List throughout; keep that style instead of rewriting every file.
ignore = ["UP006", "UP007", "UP035", "UP038"]
